# Tests the package with EnvoScale at the commit in envoscale.ref, on Linux and Windows.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          git clone -q https://github.com/envoscale/EnvoScale envoscale
          git -C envoscale -c advice.detachedHead=false checkout -q "$(cat envoscale.ref)"
          cd envoscale && ./build.sh build
      - run: |
          e=envoscale/build/envo/envo
          if [ "$RUNNER_OS" = Windows ]; then e="$e.exe"; fi
          "$e" test
      - run: |
          e=envoscale/build/envo/envo
          if [ "$RUNNER_OS" = Windows ]; then e="$e.exe"; fi
          "$e" build site
          cd envoscale && s=../site/build/site; if [ "$RUNNER_OS" = Windows ]; then s="$s.exe"; fi; "$s" build build/site && test -f build/site/index.html
